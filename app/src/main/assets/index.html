<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИК-пульт</title>
<style>
:root{--bg:#111;--fg:#eee;--card:#222;--ac:#ff6a00}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f4;--fg:#111;--card:#fff}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:sans-serif}
h1{font-size:20px;margin:0 0 4px}
#st{font-size:13px;opacity:.7;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,input{font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--card);color:var(--fg)}
button:active{filter:brightness(1.4)}
.chip.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pwr{background:var(--ac);color:#fff;font-weight:bold;grid-column:span 2}
.all{width:100%;background:#b00020;color:#fff;font-weight:bold;margin-bottom:12px}
input{width:80px;text-align:center}
#log{font-size:12px;opacity:.7;white-space:pre-wrap}
</style></head><body>
<h1>ИК-пульт</h1>
<div id="st"></div>
<div class="row" id="brands"></div>
<div class="grid" id="keys"></div>
<button class="all" id="all">Выключить всё (перебор брендов)</button>
<div class="row">
  <span style="align-self:center">NEC:</span>
  <input id="ca" placeholder="адрес" value="04">
  <input id="cc" placeholder="команда" value="08">
  <button id="cs">Отправить</button>
</div>
<div id="log"></div>
<script>
const B = window.Android;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = t => { $('log').textContent = t + '\n' + $('log').textContent.slice(0, 400); };

function bytesPat(bytes, hdr) {
  const p = [...hdr];
  for (const b of bytes) for (let i = 0; i < 8; i++) p.push(560, (b >> i & 1) ? 1690 : 560);
  p.push(560);
  return p;
}
const necBytes = (a, c) => [a, ~a & 255, c, ~c & 255];
const lg = c => ({f: 38000, p: bytesPat(necBytes(4, c), [9000, 4500])});
const toshiba = c => ({f: 38000, p: bytesPat(necBytes(0x40, c), [9000, 4500])});
const samsung = c => ({f: 38000, p: bytesPat([7, 7, c, ~c & 255], [4500, 4500])});
const sony = c => {
  const bits = [];
  for (let i = 0; i < 7; i++) bits.push(c >> i & 1);
  for (let i = 0; i < 5; i++) bits.push(1 >> i & 1);
  const fr = [2400, 600];
  bits.forEach(b => fr.push(b ? 1200 : 600, 600));
  fr[fr.length - 1] += 45000 - fr.reduce((a, b) => a + b);
  return {f: 40000, p: [...fr, ...fr, ...fr]};
};
let tg = 0;
const rc5 = c => {
  tg ^= 1;
  const bits = [1, 1, tg];
  for (let i = 4; i >= 0; i--) bits.push(0);
  for (let i = 5; i >= 0; i--) bits.push(c >> i & 1);
  const lv = [];
  bits.forEach(b => b ? lv.push(0, 1) : lv.push(1, 0));
  lv.shift();
  const p = []; let cur = 1, len = 0;
  lv.forEach(l => { if (l === cur) len += 889; else { p.push(len); cur = l; len = 889; } });
  p.push(len);
  return {f: 36000, p};
};

const BR = {
  Samsung: {f: samsung, k: {pwr: 2, vup: 7, vdn: 11, mute: 15, chup: 18, chdn: 16}},
  LG: {f: lg, k: {pwr: 8, vup: 2, vdn: 3, mute: 9, chup: 0, chdn: 1}},
  Sony: {f: sony, k: {pwr: 21, vup: 18, vdn: 19, mute: 20, chup: 16, chdn: 17}},
  Philips: {f: rc5, k: {pwr: 12, vup: 16, vdn: 17, mute: 13, chup: 32, chdn: 33}},
  Toshiba: {f: toshiba, k: {pwr: 0x12}}
};
const LBL = {pwr: '⏻ Питание', mute: 'Mute', vup: 'Гр. +', vdn: 'Гр. −', chup: 'Кан. +', chdn: 'Кан. −'};

function tx(freq, pat) {
  if (B) return B.transmit(freq, JSON.stringify(pat));
  log('демо: ' + freq + ' Гц, ' + pat.length + ' импульсов');
  return true;
}
let brand = 'Samsung';
function send(b, key) {
  const c = BR[b].k[key];
  if (c == null) return;
  const {f, p} = BR[b].f(c);
  const ok = tx(f, p);
  log(b + ' ' + key + (ok ? ' отправлено' : ' ОШИБКА'));
}
function render() {
  $('brands').innerHTML = '';
  Object.keys(BR).forEach(b => {
    const e = document.createElement('button');
    e.className = 'chip' + (b === brand ? ' on' : '');
    e.textContent = b;
    e.onclick = () => { brand = b; render(); };
    $('brands').appendChild(e);
  });
  $('keys').innerHTML = '';
  Object.keys(LBL).forEach(k => {
    if (BR[brand].k[k] == null) return;
    const e = document.createElement('button');
    e.className = k === 'pwr' ? 'pwr' : '';
    e.textContent = LBL[k];
    e.onclick = () => send(brand, k);
    $('keys').appendChild(e);
  });
}
$('all').onclick = async () => {
  for (const b of Object.keys(BR)) { send(b, 'pwr'); await sleep(500); }
  log('перебор завершён');
};
$('cs').onclick = () => {
  const a = parseInt($('ca').value, 16), c = parseInt($('cc').value, 16);
  if (isNaN(a) || isNaN(c)) return log('неверный hex');
  log('NEC ' + $('ca').value + '/' + $('cc').value + (tx(38000, bytesPat(necBytes(a, c), [9000, 4500])) ? ' отправлено' : ' ОШИБКА'));
};
$('st').textContent = B ? (B.hasIr() ? 'ИК-передатчик найден' : 'ИК-передатчика нет на этом телефоне') : 'Демо-режим (без ИК)';
render();
</script></body></html>
